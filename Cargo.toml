[workspace]
members = [
    "crates/core",
    "crates/physics_core",
    "crates/physics",
    "crates/character_core",
    "crates/player_input",
    "crates/character_interaction",
    "crates/gui",
    "crates/character_gui",
    "crates/world",
    "crates/client",
    "crates/server",
    "crates/debug_ui",
    "crates/network",
    "crates/chunk_storage",
    "crates/renderer",
    "crates/vanilla_palette",
    "crates/item_core",
    "crates/inventory_core",
    "crates/integration_character_physics",
    "crates/loot_core",
    "crates/loot",
    "crates/rng",
    "crates/loose_item_core",
    "crates/loose_items",
    "crates/loose_item_render",
    "crates/integration_loose_item_pickup",
    "crates/input_core",
    "crates/inventory",
    "crates/inventory_gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Andreas H. Klostergaard <akl@klostergaard.net>"]

# Workspace-wide clippy lint configuration.
#
# Bevy ECS system signatures naturally produce many parameters and deeply
# nested `Query<...>` filter types. Both `clippy::type_complexity` and
# `clippy::too_many_arguments` flag these as warnings even though the
# resulting code is idiomatic and well-typed. Silencing them keeps
# `cargo clippy` signal-to-noise high for the warnings that actually
# matter (genuine bugs, unused code, etc.).
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
erased-serde = "0.4"
dd40_core = { path = "crates/core" }
dd40_physics_core = { path = "crates/physics_core" }
dd40_physics = { path = "crates/physics" }
dd40_character_core = { path = "crates/character_core" }
dd40_player_input = { path = "crates/player_input" }
dd40_character_interaction = { path = "crates/character_interaction" }
dd40_gui = { path = "crates/gui" }
dd40_character_gui = { path = "crates/character_gui" }
dd40_world = { path = "crates/world" }
dd40_renderer = { path = "crates/renderer" }
dd40_debug_ui = { path = "crates/debug_ui" }
dd40_network = { path = "crates/network" }
dd40_chunk_storage = { path = "crates/chunk_storage" }
dd40_vanilla_palette = { path = "crates/vanilla_palette" }
dd40_item_core = { path = "crates/item_core" }
dd40_inventory_core = { path = "crates/inventory_core" }
dd40_loot_core = { path = "crates/loot_core" }
dd40_loot = { path = "crates/loot" }
dd40_integration_character_physics = { path = "crates/integration_character_physics" }
dd40_rng = { path = "crates/rng" }
dd40_loose_item_core = { path = "crates/loose_item_core" }
dd40_loose_items = { path = "crates/loose_items" }
dd40_loose_item_render = { path = "crates/loose_item_render" }
dd40_integration_loose_item_pickup = { path = "crates/integration_loose_item_pickup" }
dd40_input_core = { path = "crates/input_core" }
dd40_inventory = { path = "crates/inventory" }
dd40_inventory_gui = { path = "crates/inventory_gui" }
